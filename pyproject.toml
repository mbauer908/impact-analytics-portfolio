[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-analytics-portfolio"
version = "0.1.0"
description = "Analytical portfolio: cost-effectiveness, evidence synthesis, and climate/social-impact geospatial work."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M. Bauer" }]
license = { text = "MIT" }
dependencies = [
  "marimo>=0.9",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
